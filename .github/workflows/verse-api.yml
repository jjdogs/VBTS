# Every Monday: reads Epic's Verse API reference, rebuilds the device list, and opens (or updates)
# a pull request into dev when anything changed. Nothing is merged automatically.
# Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Verse API sync
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to start CI on the pull request (pull requests opened by a workflow don't start it)

concurrency:
  group: verse-api-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BRANCH: verse-api-sync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Read Epic's Verse API reference
        run: python3 scripts/fetch-verse-api.py

      - name: Rebuild the device list
        run: python3 scripts/extract-devices.py | tee report.txt

      - name: Check the result
        id: checks
        run: |
          if git diff --quiet -- scripts/data src/engine/data; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Nothing changed in the Verse API."
            exit 0
          fi
          echo "changed=yes" >> "$GITHUB_OUTPUT"
          if npm run check && npm test && npm run build; then
            echo "result=Type-check, tests and build pass." >> "$GITHUB_OUTPUT"
          else
            echo "result=⚠️ Type-check, tests or build fail with this change: see the workflow run and fix before merging." >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.checks.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.checks.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add scripts/data src/engine/data
          git commit -m "Verse API sync $(date -u +%F)"
          git push --force origin "$BRANCH"
          {
            echo "Epic's Verse API reference changed since the last sync."
            echo
            echo "$RESULT ([workflow run]($RUN_URL))"
            echo
            echo "## What changed"
            echo
            echo "Check new events' types: Epic's reference doesn't show them, so they are read from the event's description."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "\`scripts/data/verse-api-devices.json\` shows the full difference in Epic's reference."
          } > body.md
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --body-file body.md
          else
            gh pr create --base dev --head "$BRANCH" --title "Verse API sync $(date -u +%F)" --body-file body.md
          fi
          gh workflow run ci.yml --ref "$BRANCH"
